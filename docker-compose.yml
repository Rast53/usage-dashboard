# Dockhand autodeploy on tw-msk-server (local socket env).
# Wallet-only stack: DeepSeek / OpenRouter / Z.AI / Command Code / Kimi / OpenCode Go.
# ${VARS} + secrets come from dockhand stack_environment_variables (DEEPSEEK_API_KEY редактируется через UI).
services:
  usage-dashboard:
    build: .
    restart: unless-stopped
    volumes:
      - /opt/usage-dashboard/data:/app/data
    environment:
      - USAGE_PORT=${USAGE_PORT:-3210}
      - USAGE_POLL_SECONDS=${USAGE_POLL_SECONDS:-60}
      - USAGE_WINDOW_HOURS=${USAGE_WINDOW_HOURS:-24}
      - USAGE_QUOTA_PROBE_SECONDS=${USAGE_QUOTA_PROBE_SECONDS:-300}
      - USAGE_DATA_DIR=/app/data
      - USAGE_STATIC_DIR=/app/static
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MANAGEMENT_KEY=${OPENROUTER_MANAGEMENT_KEY:-}
      # tw-msk DPI blocks openrouter.ai; default origin is London nginx :8444 over Tailscale.
      # Override to https://openrouter.ai + OPENROUTER_PROXY=socks5h://host.docker.internal:<port> for socks-relay.
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-http://100.69.177.71:8444}
      - OPENROUTER_PROXY=${OPENROUTER_PROXY:-}
      - OPENROUTER_SSL_NO_VERIFY=${OPENROUTER_SSL_NO_VERIFY:-1}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      # Direct docker egress to api.z.ai from tw-msk fails; HTTP CONNECT / SOCKS5(h).
      # Userinfo is a secret — set ZAI_PROXY in Dockhand stack env (is_secret). Never commit.
      - ZAI_PROXY=${ZAI_PROXY:-}
      - COMMANDCODE_API_KEY=${COMMANDCODE_API_KEY:-}
      # Optional: HTTP CONNECT / SOCKS5(h) if api.commandcode.ai is blocked from the container.
      - COMMANDCODE_PROXY=${COMMANDCODE_PROXY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      # Optional: HTTP CONNECT / SOCKS5(h) if api.kimi.com is blocked from the container.
      - KIMI_PROXY=${KIMI_PROXY:-}
      - KIMI_CODE_BASE_URL=${KIMI_CODE_BASE_URL:-}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      # Optional: HTTP CONNECT / SOCKS5(h) if opencode.ai is blocked from the container.
      - OPENCODE_GO_PROXY=${OPENCODE_GO_PROXY:-}
      - OPENCODE_GO_BASE_URL=${OPENCODE_GO_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik-net
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-net
      traefik.http.routers.usage-http.rule: Host(`usage.ragpt.ru`)
      traefik.http.routers.usage-http.entrypoints: web
      traefik.http.routers.usage-http.middlewares: redirect-to-https@file
      traefik.http.routers.usage-secure.rule: Host(`usage.ragpt.ru`)
      traefik.http.routers.usage-secure.entrypoints: websecure
      traefik.http.routers.usage-secure.tls: "true"
      traefik.http.routers.usage-secure.tls.certresolver: letsencrypt
      traefik.http.routers.usage-secure.middlewares: tasks-basicauth@file,security-headers@file
      traefik.http.services.usage.loadbalancer.server.port: "3210"
networks:
  traefik-net:
    external: true
